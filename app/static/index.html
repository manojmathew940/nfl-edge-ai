<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NFL AI Analyst</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>NFL AI Analyst</span>
        </div>
        <span id="provider-status" class="status-pill">OpenAI GPT-5.5</span>
      </div>
    </header>

    <main class="shell">
      <section class="banner" aria-labelledby="app-title">
        <img src="/static/assets/stadium-header.webp" alt="" aria-hidden="true">
        <div class="banner-shade"></div>
        <div class="banner-copy">
          <p class="eyebrow">League-Wide Football Analysis</p>
          <h1 id="app-title">NFL AI Analyst</h1>
        </div>
      </section>

      <div class="analysis-grid">
        <section class="query-panel" aria-labelledby="query-title">
          <div class="panel-heading">
            <p class="panel-label">Question</p>
            <h2 id="query-title">What do you want to understand?</h2>
          </div>

          <form id="ask-form" class="ask-form">
            <label class="field">
              <span>Model</span>
              <select id="model" name="provider" required>
                <option value="openai" selected>OpenAI (GPT-5.5)</option>
                <!-- Local model paused until its SQL accuracy is improved. -->
                <option value="local" disabled>Qwen 2.5 (Local, paused)</option>
              </select>
            </label>

            <label class="field">
              <span>Ask the analyst</span>
              <textarea id="question" name="question" rows="6" required>What was Kansas City's EPA on third-and-long in the fourth quarter?</textarea>
            </label>

            <div class="actions">
              <button id="ask-button" type="submit">Analyze</button>
              <p id="loading" class="loading" hidden>Analyzing question...</p>
            </div>
          </form>

          <details class="developer-tools">
            <summary>Developer Tools</summary>
            <div class="developer-content">
              <details class="data-panel">
                <summary>Analytics JSON</summary>
                <pre id="analytics">{}</pre>
              </details>

              <details id="debug-panel" class="data-panel" hidden>
                <summary>LLM Debug Payload</summary>
                <pre id="debug-payload">{}</pre>
              </details>
            </div>
          </details>
        </section>

        <section class="answer-panel" aria-labelledby="answer-title">
          <div class="answer-header">
            <div>
              <p class="panel-label">Analysis</p>
              <h2 id="answer-title">Answer</h2>
            </div>
            <span id="grounding-badge" class="grounding-badge neutral">Ready</span>
          </div>

          <div id="error" class="message error" role="alert" hidden></div>

          <p id="grounding-detail" class="grounding-detail" hidden></p>

          <div id="answer" class="answer empty">Submit a question to begin an analysis.</div>
        </section>
      </div>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
